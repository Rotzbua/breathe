name: Lint source code

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --group build
        python -m pip install --group lint

    - name: Generate parser
      run: |
        make parser
        make format-parser

    - name: Lint with Ruff
      run: ruff check --output-format=github

    - name: Format with Ruff
      run: ruff format --diff

  mypy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.9"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --group build --group build
        python -m pip install --group build --group lint

    - name: Generate parser
      run: make parser

    - name: Type check with mypy
      run: mypy --warn-redundant-casts --warn-unused-ignores breathe tests

  twine:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade twine build
        python -m pip install --group build
        python -m pip install jinja2

    - name: Generate parser
      run: make parser

    - name: Lint with twine
      run: |
        python -m build .
        twine check dist/*
